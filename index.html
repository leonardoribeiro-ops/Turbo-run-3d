<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Run 3D</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="logo">TURBO <span>RUN 3D</span></div>
    <div class="stats">
      <div class="stat">PONTOS <strong id="score">0</strong></div>
      <div class="stat">MOEDAS <strong id="coins">0</strong></div>
      <div class="stat">DISTÂNCIA <strong id="distance">0</strong> m</div>
    </div>
  </div>

  <div id="message" class="panel">
    <h1 id="messageTitle">TURBO RUN 3D</h1>
    <p id="messageText">Desvie dos obstáculos, colete moedas e chegue à linha de chegada!</p>
    <p class="controls">← → mover · ↑ acelerar · ↓ frear</p>
    <button id="startButton">INICIAR CORRIDA</button>
  </div>

  <div id="finishMessage" class="panel hidden">
    <h1>VOCÊ CHEGOU!</h1>
    <p id="finalScore">Pontuação: 0</p>
    <button id="restartButton">JOGAR NOVAMENTE</button>
  </div>

  <div id="help">Use as setas do teclado para controlar o carro.</div>
  <script type="module" src="js/script.js"></script>
</body>
</html>
